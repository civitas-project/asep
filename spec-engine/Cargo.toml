[package]
name = "asep"
version = "4.0.0-alpha"
edition = "2021"
authors = ["da578 & AI Assistant"]
description = "Axiomatic Systems Engineering Protocol (ASEP): Deterministic SDLC validator, traceability graph checker, and living spec engine"

[lib]
name = "asep"
path = "src/lib.rs"

[[bin]]
name = "asep"
path = "src/main.rs"

[[bin]]
name = "spec-engine"
path = "src/bin/spec-engine.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.0"
ignore = "0.4"
regex = "1.11"
inquire = "0.9.4"
toml = "1.1.8"
sha2 = "0.10"
similar = "2.7"
semver = "1.0"
notify = "6.1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
srcidx = { path = "../srcidx" }
srcdump = { path = "../srcdump" }
[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.17"
criterion = "0.5"

[[bench]]
name = "engine_benchmarks"
harness = false

[lints.rust]
unsafe_code = "deny"
